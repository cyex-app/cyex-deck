[package]
name = "cyex-twitch"
description = "Twitch API clients: id.twitch.tv, Helix, GQL, usher, Hermes; chat helper services"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# P4 #16 Test hooks: `Http::mocked` sends Helix and GQL to a local mock. Test builds only, never in a release.
mocks = []

[dependencies]
cyex-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
ts-rs.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# tests/signed_in.rs reads the default account's token from this PC's credential store.
keyring.workspace = true

[lints]
workspace = true
